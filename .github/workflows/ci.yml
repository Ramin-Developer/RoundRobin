name: CI

on:
  push:
    branches: [ main, master, upgrade-dotnet-10 ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ChessTournament.slnx

      - name: Verify formatting and style
        run: |
          dotnet format ChessTournament/ChessTournament.csproj --verify-no-changes --no-restore
          dotnet format ChessTournament.Test/ChessTournament.Test.csproj --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ChessTournament.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ChessTournament.slnx --configuration Release --no-build --verbosity normal
